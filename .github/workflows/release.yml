name: Release

# Pushing a tag like v0.1.0 builds a universal Bitamp.app and publishes it as a GitHub
# Release. A tag with a suffix, like v0.2.0-beta.1, makes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Test
        run: scripts/test.sh

      - name: Build the universal app
        run: scripts/bundle.sh --universal --version "${{ steps.version.outputs.version }}"

      - name: Check the app
        run: |
          binary=Bitamp.app/Contents/MacOS/Bitamp
          archs="$(lipo -archs "$binary")"
          echo "Architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::Not universal"; exit 1 ;; esac
          test "$(plutil -extract CFBundleShortVersionString raw Bitamp.app/Contents/Info.plist)" = "${{ steps.version.outputs.version }}"
          codesign --verify --deep --strict Bitamp.app

      - name: Package
        id: package
        run: |
          zip="Bitamp-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent Bitamp.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          cat "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          cat > notes.md <<EOF
          ## Install

          1. Download \`$ZIP\`, unzip it, and move **Bitamp** to Applications.
          2. Bitamp isn't notarized by Apple yet, so the first time you open it macOS will say it can't check it for malware. Click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway** next to the note about Bitamp. You only need to do this once.

             Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Bitamp.app\`

          Runs on macOS 13 or later, on Apple Silicon and Intel Macs.

          EOF
          prerelease=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --verify-tag --title "Bitamp $VERSION" --notes-file notes.md --generate-notes $prerelease
