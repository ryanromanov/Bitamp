name: Release

# Pushing a tag like v0.1.0 builds a universal Bitamp.app and publishes it as a GitHub
# Release. A tag with a suffix, like v0.2.0-beta.1, makes a pre-release.
#
# With these repository secrets set, the app is signed with Developer ID and notarized:
#   DEVELOPER_ID_P12          base64 of the exported "Developer ID Application" certificate and key
#   DEVELOPER_ID_P12_PASSWORD the password chosen when exporting it
#   NOTARY_KEY_P8             base64 of an App Store Connect API key (.p8) with the Developer role
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID   that key's ID and its issuer ID
# Without them it's ad-hoc signed, and the release notes explain Open Anyway.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Test
        run: scripts/test.sh

      - name: Import the Developer ID certificate
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No Developer ID secrets, so this release is ad-hoc signed and not notarized."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build the universal app
        run: scripts/bundle.sh --universal --version "${{ steps.version.outputs.version }}" --sign "${{ steps.signing.outputs.identity }}"

      - name: Notarize
        if: steps.signing.outputs.identity != '-'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          scripts/notarize.sh Bitamp.app
          rm "$NOTARY_KEY"

      - name: Check the app
        run: |
          binary=Bitamp.app/Contents/MacOS/Bitamp
          archs="$(lipo -archs "$binary")"
          echo "Architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::Not universal"; exit 1 ;; esac
          test "$(plutil -extract CFBundleShortVersionString raw Bitamp.app/Contents/Info.plist)" = "${{ steps.version.outputs.version }}"
          codesign --verify --deep --strict Bitamp.app
          codesign --display --verbose=2 Bitamp.app 2>&1 | grep -E "Authority|flags"

      - name: Package
        id: package
        run: |
          zip="Bitamp-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent Bitamp.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          cat "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          NOTARIZED: ${{ steps.signing.outputs.identity != '-' }}
        run: |
          if [ "$NOTARIZED" = "true" ]; then
          cat > notes.md <<EOF
          ## Install

          Download \`$ZIP\`, unzip it, move **Bitamp** to Applications and open it. It's signed and notarized by Apple.

          Runs on macOS 13 or later, on Apple Silicon and Intel Macs.

          EOF
          else
          cat > notes.md <<EOF
          ## Install

          1. Download \`$ZIP\`, unzip it, and move **Bitamp** to Applications.
          2. Bitamp isn't notarized by Apple, so the first time you open it macOS will say it can't check it for malware. Click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway** next to the note about Bitamp. You only need to do this once.

             Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Bitamp.app\`

          Runs on macOS 13 or later, on Apple Silicon and Intel Macs.

          EOF
          fi
          prerelease=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --verify-tag --title "Bitamp $VERSION" --notes-file notes.md --generate-notes $prerelease
